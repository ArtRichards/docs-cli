# Marks this directory as a docs root managed by `docs`.
# Without this file, `docs` still runs but with conservative defaults.

[project]
name = "docs"

[archive]
dir = "archive"               # subdir name treated as archive subtree
date_format = "%Y-%m-%d"

[vocabulary]
# Additions only. Built-in lifecycles and roles are always recognized.
# add_lifecycles = ["shipped"]
# add_roles      = ["adr"]
add_lifecycles = []
add_roles      = []
