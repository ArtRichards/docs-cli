[project]
name = "docs"
version = "0.2.0-m2"
description = "Prescriptive CLI for managing trees of structured Markdown docs."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Art Richards", email = "art@bitholdersinc.com"}]
keywords = ["markdown", "documentation", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
# No runtime dependencies — stdlib only.

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "build>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
# Mypy stub for the `from docs import …` alias is hand-shaped to stay readable;
# ruff's I001 import-fixer expands the parenthesised group into one line per
# name, which is the wrong call for a .pyi re-export.
extend-exclude = ["tests/_typing/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/", "tests/"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src:$MYPY_CONFIG_FILE_DIR/tests/_typing"
